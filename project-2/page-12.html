
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsent Message</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: "Inter", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 320px;
            text-align: center;
        }

        #prompt {
            font-size: 15px;
            color: white;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        #message {
            width: 100%;
            height: 120px;
            background-color: #1a1a1a;
            border: none;
            border-radius: 18px;
            padding: 14px;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            color: white;
            outline: none;
            resize: none;
            box-sizing: border-box;
        }

        #message::placeholder {
            color: #555;
        }

        #sendbtn {
            margin-top: 12px;
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            background-color: #007aff;
            color: white;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            cursor: pointer;
        }

        #response {
        display: none;
        font-size: 15px;
        color: white;
        line-height: 2;
        opacity: 0;
        transition: opacity 1.5s;
        text-align: center;
        }

        #next {
            display: none;
            margin-top: 40px;
            font-size: 14px;
            color: #555;
            text-decoration: none;
            font-family: "Inter", sans-serif;
        }

        #next:hover {
            color: white;
            transition: color 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">

        <p id="prompt">Some things you don't say stay with you.<br><br>If you could send one message… what would it say?</p>

        <textarea id="message" placeholder="Type the message you never sent..."></textarea>
        <br>
        <button id="sendbtn" onclick="sendMessage()">Send</button>

        <div id="response">
            <p>Sent.<br>You said it somewhere.<br> Not everything needs an answer.</p>
           
        </div>

        <a href="page-13.html" id="next">next</a>

    </div>

    <script>
        function sendMessage() {
            document.getElementById("message").style.display = "none";
            document.getElementById("sendbtn").style.display = "none";
            document.getElementById("prompt").style.display = "none";

            const response = document.getElementById("response");
            response.style.display = "block";
            setTimeout(() => {
                response.style.opacity = 1;
            }, 100);

            setTimeout(() => {
                document.getElementById("next").style.display = "block";
            }, 2500);
        }
    </script>
</body>
</html>
