<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<link rel="stylesheet" href="style.css">
    <style>
        <a href="project-2/index.html">Project 2 </a> 
        hmtl {
        height: 100%; 
        margin:0; 
        }
        
        body{ 
         min-height: 100vh;
         margin: 0;
        background-image:url("assets/grass.gif");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        } 
        
        .container {
        width: 390px;
        height: 844px;
        position: relative;
        margin: 0 auto;
        overflow: hidden;
        }

         #indexmessage {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 350px;   
        }
    
        #pressstart { 
        position: absolute;
         top: 761px;
        left: 51.1%;
         transform: translateX(-55%);
        width: 300px;
         font-family:"Inter", sans-serif;
          font-weight: 500;
         font-style: normal;
          font-size: 15px;
          color: black;    
        }
       
        #startbutton { 
         position: absolute;
         top: 760px;
         left: 50.5%;
         transform: translateX(-55%);
         width: 130px;
        }
        
    </style>
</head>
<body>
    
    <img src="assets/startbutton.png" id="startbutton" width="80"/>
     <a href="page-2.html"><p id="pressstart">Press Start</p></a>
    
    <p id="instructions"> Don't overthink it. This only works if you choose. </p>
    <img src="assets/indexmessage.png" id="indexmessage" />
    <p id="imessagetext"></p>

    
     <audio id="iphonetext" src="assets/iphonetext.mp3" loop></audio>
    <script>
     const text = "To the ones who say it's fine,\nand then thought about it for three days. To the ones who type, delete, retype, and still aren't sure. To the ones who almost said it.\n\nLet's begin.";
    const el = document.getElementById('imessagetext');
    const sound = document.getElementById('iphonetext');
    let i = 0;
    let started = false;

    document.addEventListener('click', () => {
        if (!started) {
            sound.play();
            started = true;
        }
    });

    setInterval(() => {
        if (i < text.length) {
            el.textContent += text[i];
            i++;
        } else {
            sound.pause();  
            sound.currentTime = 0;  
        }
    }, 100);
    </script>
</body>
</html>
