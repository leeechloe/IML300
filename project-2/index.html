        body{ 
         min-height: 100vh;

        background-position: center;
        } 
        
        .container {
        width: 390px;
        height: 844px;
        position: relative;
        margin: 0 auto;
        overflow: hidden;
        }

         #indexmessage {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 350px;   
        }
    
        #startbutton { 
         position:absolute; 
         top: 630px;
         left: 51%;
         width: 353px;
         z-index: 1;  
         color:black;
        }
       

}
        
    </style>
</head>
<body>
    <p id="instructions"> Don't overthink it. This only works if you choose. </p>
    <p id="startbutton"> <a href= "page-2.html"> Press Start </a>
    </p>
    <img src="assets/indexmessage.png" id="indexmessage" />
    <p id="text"></p>
    <img src="assets/indexmessage.png" id="indexmessage" />
     <audio id="iphonetext" src="assets/iphonetext.mp3" loop></audio>
    <script>
     const text = "To the ones who say it's fine,\nand then thought about it for three days. To the ones who type, delete, retype, and still aren't sure. To the ones who almost said it.\n\nLet's begin.";
    const el = document.getElementById('text');
    const sound = document.getElementById('iphonetext');
    let i = 0;
    let started = false;

    document.addEventListener('click', () => {
        if (!started) {
            sound.play();
            started = true;
        }
    });

    setInterval(() => {
        if (i < text.length) {
            el.textContent += text[i];
            i++;
        } else {
            sound.pause();  
            sound.currentTime = 0;  
        }
    }, 100);
    </script>
</body>
