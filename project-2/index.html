      <audio id="iphonetext" src="assets/iphonetext.mp3" autoplay loop></audio>
    <script>
        const text = "To the ones who say it's fine, and then thought about it for three days. To the ones who type, delete, retype, and still aren't sure. To the ones who almost said it. Let's begin.";
        const el = document.getElementById('text');
        let i = 0;
         const sound = document.getElementById('iphonetext');
        setInterval(() => {
    if (i < text.length) {
        el.textContent += text[i];
        i++;
    } else {
        sound.loop();
    }
    }, 100);
    </script>
