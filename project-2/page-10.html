<!-- accidentally_unfollowed.convo-->
 <p id="accunfollowedtext">accidentally_unfollowed.convo</p>
<img src="assets/accidentally_unfollowed.convo.png" id="accidentallyunfollowed"/>
<div id="overlayaccunfollow">
<img src="assets/accidentally_unfollowed.convo.png" id="bigaccunfollow"/>
</div>
<script>
const accidentally_unfollowed = document.getElementById('accidentallyunfollowed');
const overlayaccunfollow = document.getElementById('overlayaccunfollow');

accidentally_unfollowed.addEventListener('click', () => {
    overlayaccunfollow.style.display = 'block';
});
overlayaccunfollow.addEventListener('click', () => {
    overlayaccunfollow.style.display = 'none';
});
</script>
 <!-- draftagain-->
     <p id="draftagaintext">draft_again.text</p>
    <img src="assets/draft_again.png" id="draftagain"/> 
    <div id="overlaydraftagain">
    <img src="assets/draft_again.png" id="bigdraftagain"/>
    </div>
    
    <script> 
        const draft_again = document.getElementById('draftagain');
        const overlaydraftagain = document.getElementById('overlaydraftagain');
        draft_again.addEventListener('click', () => {
            overlaydraftagain.style.display = 'block';
        });
        overlaydraftagain.addEventListener('click', () => {
            overlaydraftagain.style.display = 'none';
        });
    </script>  
</body>
