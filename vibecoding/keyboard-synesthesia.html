

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Keyboard Art </title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #060606;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
 
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    z-index: 20; background: #111; transition: background 0.8s ease;
  }
 
  #hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 11px; color: #1e1e1e; letter-spacing: 5px;
    z-index: 20; pointer-events: none;
    transition: opacity 1.5s ease; white-space: nowrap;
  }
  #hint.hide { opacity: 0; }
 
  #note-display {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 13px; color: #1a1a1a; letter-spacing: 6px;
    z-index: 20; pointer-events: none;
    transition: color 0.4s ease; white-space: nowrap;
  }
 
  #key-indicators {
    position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 20; pointer-events: none;
    flex-wrap: wrap; justify-content: center; max-width: 90vw;
  }
  .ki {
    width: 22px; height: 22px; border: 1px solid #161616;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; font-size: 9px; color: #1e1e1e;
    letter-spacing: 1px; border-radius: 3px;
    transition: all 0.15s ease; text-transform: uppercase;
  }
  .ki.active { transform: scale(1.15); }
 
  #splash {
    position: fixed; inset: 0; background: #060606;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; transition: opacity 1.4s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash h1 {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: clamp(30px, 5vw, 56px); color: #242424;
    letter-spacing: 8px; margin-bottom: 12px;
  }
  #splash p {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 11px; color: #181818; letter-spacing: 5px; margin-bottom: 50px;
  }
  #start-btn {
    background: none; border: 1px solid #242424; color: #333;
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; letter-spacing: 4px; padding: 13px 36px;
    cursor: pointer; transition: all 0.5s; outline: none;
  }
  #start-btn:hover { border-color: #666; color: #999; }
 
  #clr-btn {
    position: fixed; top: 14px; right: 22px;
    background: none; border: 1px solid #161616; color: #242424;
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 9px; letter-spacing: 3px; padding: 6px 12px;
    cursor: pointer; transition: all 0.4s; z-index: 20; outline: none;
  }
  #clr-btn:hover { border-color: #444; color: #666; }
</style>
</head>
<body>
 
<canvas id="canvas"></canvas>
<div id="topbar"></div>
<div id="note-display">—</div>
<button id="clr-btn">clear</button>
<div id="hint">press any key</div>
<div id="key-indicators"></div>
 
<div id="splash">
  <h1>play</h1>
  <p>every key · a note · a color</p>
  <button id="start-btn">begin</button>
</div>
 
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
}
resize();
window.addEventListener('resize', resize);
 
let ac = null;
function getAC() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  return ac;
}
 
const ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m'],
];
 
const BASE_FREQS = [
  [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51],
  [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33],
  [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94],
];
 
const ROW_PALETTES = [
  [195, 210, 225, 240, 255, 270, 285, 300, 315, 180],
  [30,  45,  60,  15,  0,   345, 320, 40,  55],
  [160, 140, 120, 100, 80,  60,  40],
];
 
const ROW_SAT = [70, 60, 50];
const ROW_LIT = [55, 48, 40];
 
const KEY_MAP = {};
ROWS.forEach((row, ri) => {
  row.forEach((k, ki) => {
    KEY_MAP[k] = {
      freq: BASE_FREQS[ri][ki],
      hue: ROW_PALETTES[ri][ki],
      sat: ROW_SAT[ri],
      lit: ROW_LIT[ri],
      row: ri, col: ki, rowLen: row.length,
    };
  });
});
KEY_MAP[' '] = { freq: 65, hue: 240, sat: 30, lit: 20, row: 3, col: 0, rowLen: 1 };
 
const kiContainer = document.getElementById('key-indicators');
const kiEls = {};
[...ROWS[0], ...ROWS[1], ...ROWS[2]].forEach(k => {
  const el = document.createElement('div');
  el.className = 'ki';
  el.id = 'ki-' + k;
  el.textContent = k;
  kiContainer.appendChild(el);
  kiEls[k] = el;
});
 
const particles = [];
const ripples = [];
const trails = [];
 
function spawnParticles(x, y, hue, sat, lit, energy, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * energy * 0.12;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      hue: hue + (Math.random()-0.5)*18,
      sat, lit,
      alpha: 0.6 + Math.random()*0.3,
      size: 1.5 + Math.random() * (energy*0.04),
      life: 1,
      decay: 0.018 + Math.random()*0.022,
    });
  }
}
 
function spawnRipple(x, y, hue, sat, lit, energy) {
  ripples.push({
    x, y, r: 4,
    maxR: 60 + energy * 0.5,
    hue, sat, lit,
    alpha: 0.5,
    speed: 2 + energy * 0.04,
  });
}
 
function spawnTrail(x, y, hue, sat, lit, energy) {
  trails.push({
    x: x + (Math.random()-0.5)*40,
    y: y + (Math.random()-0.5)*40,
    hue: hue + (Math.random()-0.5)*12,
    sat, lit,
    size: 12 + energy * 0.18 + Math.random()*20,
    alpha: 0.04 + (energy/255)*0.06,
    angle: Math.random()*Math.PI,
    drawn: false,
  });
}
 
const activeNodes = {};
 
function playNote(key, info) {
  const a = getAC();
  if (activeNodes[key]) {
    try { activeNodes[key].stop(a.currentTime + 0.05); } catch(e){}
  }
  const osc1 = a.createOscillator();
  const osc2 = a.createOscillator();
  const gainNode = a.createGain();
  const filter = a.createBiquadFilter();
 
  osc1.type = info.row === 2 ? 'sine' : info.row === 1 ? 'triangle' : 'sine';
  osc2.type = 'sine';
  osc1.frequency.value = info.freq;
  osc2.frequency.value = info.freq * 1.005;
 
  filter.type = 'lowpass';
  filter.frequency.value = info.row === 2 ? 400 : info.row === 1 ? 2000 : 6000;
 
  gainNode.gain.setValueAtTime(0, a.currentTime);
  gainNode.gain.linearRampToValueAtTime(0.22, a.currentTime + 0.01);
  gainNode.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (info.row === 2 ? 1.8 : info.row === 1 ? 1.2 : 0.9));
 
  const gainEcho = a.createGain();
  gainEcho.gain.setValueAtTime(0, a.currentTime);
  gainEcho.gain.linearRampToValueAtTime(0.06, a.currentTime + 0.08);
  gainEcho.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 2.2);
 
  osc1.connect(filter); osc2.connect(filter);
  filter.connect(gainNode); filter.connect(gainEcho);
  gainNode.connect(a.destination); gainEcho.connect(a.destination);
 
  osc1.start(a.currentTime); osc2.start(a.currentTime);
  const stopAt = a.currentTime + (info.row === 2 ? 2.2 : 1.8);
  osc1.stop(stopAt); osc2.stop(stopAt);
  activeNodes[key] = osc1;
}
 
const noteNames = {
  q:'C5',w:'D5',e:'E5',r:'F5',t:'G5',y:'A5',u:'B5',i:'C6',o:'D6',p:'E6',
  a:'C4',s:'D4',d:'E4',f:'F4',g:'G4',h:'A4',j:'B4',k:'C5',l:'D5',
  z:'C3',x:'D3',c:'E3',v:'F3',b:'G3',n:'A3',m:'B3',
  ' ':'BASS',
};
 
let lastNoteTime = 0;
let hintHidden = false;
let frame = 0;
 
function triggerKey(key) {
  const info = KEY_MAP[key];
  if (!info) return;
 
  playNote(key, info);
 
  const xFrac = info.col / Math.max(1, info.rowLen - 1);
  const yFrac = info.row / 3;
  const x = W * 0.1 + xFrac * W * 0.8 + (Math.random()-0.5)*30;
  const y = H * 0.15 + yFrac * H * 0.65 + (Math.random()-0.5)*20;
  const energy = (1 - yFrac) * 180 + 60;
 
  spawnParticles(x, y, info.hue, info.sat, info.lit, energy, Math.floor(8 + energy/18));
  spawnRipple(x, y, info.hue, info.sat, info.lit, energy);
  for (let i = 0; i < 3; i++) spawnTrail(x, y, info.hue, info.sat, info.lit, energy);
 
  document.getElementById('topbar').style.background =
    `hsla(${info.hue},${info.sat}%,${info.lit + 10}%,0.8)`;
 
  const noteEl = document.getElementById('note-display');
  noteEl.textContent = noteNames[key] || key.toUpperCase();
  noteEl.style.color = `hsla(${info.hue},${info.sat}%,${info.lit + 25}%,0.6)`;
 
  const kiEl = kiEls[key];
  if (kiEl) {
    kiEl.classList.add('active');
    kiEl.style.borderColor = `hsl(${info.hue},${info.sat}%,${info.lit}%)`;
    kiEl.style.color = `hsl(${info.hue},${info.sat}%,${info.lit + 20}%)`;
    kiEl.style.background = `hsla(${info.hue},${info.sat}%,${info.lit}%,0.12)`;
    setTimeout(() => {
      kiEl.classList.remove('active');
      kiEl.style.borderColor = '';
      kiEl.style.color = '';
      kiEl.style.background = '';
    }, 200);
  }
 
  if (!hintHidden) {
    hintHidden = true;
    document.getElementById('hint').classList.add('hide');
  }
 
  lastNoteTime = frame;
}
 
const heldKeys = new Set();
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const key = e.key === ' ' ? ' ' : e.key.toLowerCase();
  if (heldKeys.has(key)) return;
  heldKeys.add(key);
  triggerKey(key);
  if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => {
  const key = e.key === ' ' ? ' ' : e.key.toLowerCase();
  heldKeys.delete(key);
});
 
function loop() {
  requestAnimationFrame(loop);
  frame++;
 
  // trails stay permanently on canvas — no fade
  trails.forEach(t => {
    if (t.drawn) return;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.angle);
    ctx.beginPath();
    ctx.ellipse(0, 0, t.size, t.size * 0.35, 0, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${t.hue},${t.sat}%,${t.lit}%,${t.alpha.toFixed(4)})`;
    ctx.fill();
    ctx.restore();
    t.drawn = true;
  });
  for (let i = trails.length - 1; i >= 0; i--) {
    if (trails[i].drawn) trails.splice(i, 1);
  }
 
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += r.speed;
    r.alpha -= 0.012;
    if (r.alpha <= 0 || r.r > r.maxR) { ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.strokeStyle = `hsla(${r.hue},${r.sat}%,${r.lit + 15}%,${r.alpha.toFixed(3)})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
 
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.vy += 0.04;
    p.life -= p.decay;
    p.alpha = p.life * 0.8;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.3, p.size * p.life), 0, Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},${p.sat}%,${p.lit}%,${p.alpha.toFixed(3)})`;
    ctx.fill();
  }
 
  if (frame - lastNoteTime > 90) {
    document.getElementById('note-display').style.color = '#1a1a1a';
  }
}
 
document.getElementById('start-btn').addEventListener('click', () => {
  const splash = document.getElementById('splash');
  splash.classList.add('hide');
  setTimeout(() => splash.style.display = 'none', 1500);
  getAC();
});
 
document.getElementById('clr-btn').addEventListener('click', () => {
  ctx.clearRect(0, 0, W, H);
});
 
loop();
</script>
</body>
</html>
